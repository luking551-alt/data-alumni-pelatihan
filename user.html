
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12365b">
  <title>Data Alumni — User</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #f1f5f9;
      color: #1e293b;
      font-family: Arial, sans-serif;
    }

    header {
      background: #12365b;
      color: white;
      padding: 22px 5%;
      display: flex;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    h1 { font-size: 22px; margin: 0 0 5px; }
    .sub { opacity: .85; font-size: 14px; }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .logout { background: white; color: #12365b; }

    .wrap {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px;
    }

    .panel {
      background: white;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 5px 20px #0f172a0a;
    }

    .tools {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .tools input {
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      min-width: 220px;
      flex: 1;
    }

    .note {
      font-size: 13px;
      color: #64748b;
      margin: 0 0 14px;
    }

    .tablewrap { overflow: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 800px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #e8f1fb;
      color: #12365b;
      white-space: nowrap;
    }

    td { overflow-wrap: anywhere; }

    #message {
      padding: 16px 0 0;
      color: #475569;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #message.error { color: #b91c1c; }

    @media (max-width: 600px) {
      header { padding: 20px 16px; }
      .wrap { margin: 16px auto; }
      .panel { padding: 14px; }
      h1 { font-size: 19px; }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>DATA ALUMNI PESERTA PELATIHAN</h1>
      <div class="sub">Halaman User · hanya lihat data</div>
    </div>
    <button class="logout" id="logoutBtn" type="button">Keluar</button>
  </header>

  <main class="wrap">
    <section class="panel">
      <div class="tools">
        <input
          id="search"
          type="search"
          placeholder="Cari nama, nomor induk, atau program..."
          aria-label="Cari data alumni"
          autocomplete="off"
        >
        <span id="count">Memeriksa sesi login…</span>
      </div>

      <p class="note">
        Akun User hanya dapat melihat enam kolom data alumni.
        Fitur tambah, edit, hapus, dan Excel tidak tersedia.
      </p>

      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th>No.</th>
              <th>Nama Lengkap</th>
              <th>Nomor Induk</th>
              <th>Tahun</th>
              <th>Status</th>
              <th>Program Pelatihan</th>
              <th>Tanggal Pendataan</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr>
              <td colspan="7">Memeriksa sesi login…</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div id="message" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    "use strict";

    const SUPABASE_URL =
      "https://qjxxvlpmprrhtbuoeowl.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_woWtPMjGFKExlohZIpp1iQ_x3ylrMWu";

    const ADMIN_UID =
      "9bd8d934-e208-44f9-b13b-a9ca8a962e4b";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true
        }
      }
    );

    const rowsElement = document.getElementById("rows");
    const searchElement = document.getElementById("search");
    const countElement = document.getElementById("count");
    const messageElement = document.getElementById("message");
    const logoutButton = document.getElementById("logoutBtn");

    let alumni = [];
    let loading = true;
    let redirecting = false;
    let signingOut = false;

    function showMessage(text, isError = false) {
      messageElement.textContent = text;
      messageElement.classList.toggle("error", isError);
    }

    function showTableMessage(text) {
      rowsElement.replaceChildren();

      const tr = document.createElement("tr");
      const td = document.createElement("td");

      td.colSpan = 7;
      td.textContent = text;

      tr.appendChild(td);
      rowsElement.appendChild(tr);
    }

    function formatValue(value) {
      if (value === null || value === undefined || value === "") {
        return "—";
      }

      return String(value);
    }

    function render() {
      if (loading) return;

      const query = searchElement.value
        .trim()
        .toLocaleLowerCase("id");

      const found = alumni.filter(item => {
        const searchable = [
          item.nama_lengkap,
          item.nomor_induk,
          item.program_pelatihan,
          item.status
        ];

        return searchable.some(value =>
          String(value ?? "")
            .toLocaleLowerCase("id")
            .includes(query)
        );
      });

      rowsElement.replaceChildren();

      countElement.textContent =
        `${found.length} dari ${alumni.length} data`;

      if (found.length === 0) {
        showTableMessage(
          alumni.length === 0
            ? "Belum ada data alumni."
            : "Data tidak ditemukan."
        );
        return;
      }

      found.forEach((item, index) => {
        const tr = document.createElement("tr");

        // Hanya enam kolom data alumni yang ditampilkan.
        const values = [
          index + 1,
          item.nama_lengkap,
          item.nomor_induk,
          item.tahun_pelatihan,
          item.status,
          item.program_pelatihan,
          item.tanggal_pendataan
        ];

        values.forEach(value => {
          const td = document.createElement("td");
          td.textContent = formatValue(value);
          tr.appendChild(td);
        });

        rowsElement.appendChild(tr);
      });
    }

    async function init() {
      loading = true;
      logoutButton.disabled = true;
      countElement.textContent = "Memeriksa sesi login…";
      showMessage("");
      showTableMessage("Memeriksa sesi login…");

      try {
        const { data, error } = await client.auth.getSession();

        if (error) throw error;

        const user = data.session?.user;

        if (!user) {
          window.location.replace("akses.html");
          return;
        }

        if (user.id === ADMIN_UID) {
          window.location.replace("dashboard.html");
          return;
        }

        showTableMessage("Memuat data alumni…");
        countElement.textContent = "Memuat data…";

        const { data: result, error: rpcError } =
          await client.rpc("lihat_alumni_user");

        if (rpcError) throw rpcError;

        alumni = Array.isArray(result) ? result : [];

        // Pastikan hanya enam field yang dipakai oleh antarmuka.
        alumni = alumni.map(item => ({
          nama_lengkap: item.nama_lengkap,
          nomor_induk: item.nomor_induk,
          tahun_pelatihan: item.tahun_pelatihan,
          status: item.status,
          program_pelatihan: item.program_pelatihan,
          tanggal_pendataan: item.tanggal_pendataan
        }));

        loading = false;
        render();
        showMessage("Data berhasil dimuat.");
      } catch (error) {
        console.error("Gagal memuat data alumni:", error);

        loading = false;
        alumni = [];
        countElement.textContent = "Data belum tersedia";
        showTableMessage("Data gagal dimuat.");

        showMessage(
          "Data belum dapat dimuat. Periksa koneksi internet, " +
          "konfigurasi Google OAuth, serta fungsi RPC lihat_alumni_user " +
          "di Supabase. Detail: " +
          (error?.message || "Kesalahan tidak diketahui"),
          true
        );
      } finally {
        logoutButton.disabled = false;
      }
    }

    searchElement.addEventListener("input", render);

    logoutButton.addEventListener("click", async () => {
      if (signingOut) return;

      signingOut = true;
      logoutButton.disabled = true;
      logoutButton.textContent = "Keluar…";

      try {
        const { error } = await client.auth.signOut();

        if (error) throw error;

        window.location.replace("akses.html");
      } catch (error) {
        console.error("Gagal keluar:", error);

        showMessage(
          "Gagal keluar. Silakan coba kembali. " +
          (error?.message || ""),
          true
        );

        signingOut = false;
        logoutButton.disabled = false;
        logoutButton.textContent = "Keluar";
      }
    });

    client.auth.onAuthStateChange((event, session) => {
      if (
        !signingOut &&
        !redirecting &&
        event === "SIGNED_OUT"
      ) {
        redirecting = true;
        window.location.replace("akses.html");
        return;
      }

      if (
        !signingOut &&
        session?.user?.id === ADMIN_UID &&
        !redirecting
      ) {
        redirecting = true;
        window.location.replace("dashboard.html");
      }
    });

    init();
  </script>
</body>
</html>
